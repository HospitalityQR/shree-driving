<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Hut — Scan & Order Standee</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-night: #0a0204;
            --gold-primary: #d4af37;
            --gold-light: #fbe69b;
            --gold-dark: #9a7414;
            --gold-gradient: linear-gradient(135deg, #fbe69b 0%, #d4af37 55%, #9a7414 100%);
            --lotus-red: #d91438;
            --lotus-neon: #ff2a51;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            background-color: #140407;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 12px;
            color: #ffffff;
        }

        /* Top Toolbar for Printing */
        .controls-toolbar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: #20060d;
            border: 1px solid var(--gold-primary);
            padding: 10px 16px;
            border-radius: 14px;
        }

        .btn-print {
            background: var(--gold-gradient);
            color: #0b0204;
            font-weight: 800;
            font-size: 13.5px;
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
        }

        /* CLEAN MINIMAL STANDEE FRAME */
        .standee-frame {
            width: 100%;
            max-width: 440px;
            background: #0a0204;
            background-image: linear-gradient(180deg, rgba(12, 2, 5, 0.88) 0%, rgba(10, 2, 4, 0.96) 100%),
                              url('ambience_night.png');
            background-size: cover;
            background-position: center top;
            border: 4px solid var(--gold-primary);
            border-radius: 28px;
            padding: 30px 22px 26px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.9), 0 0 30px rgba(217, 20, 56, 0.35);
            overflow: hidden;
        }

        /* Inner Gold Hairline Frame */
        .standee-frame::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1.5px solid rgba(251, 230, 155, 0.65);
            border-radius: 20px;
            pointer-events: none;
        }

        /* Logo */
        .logo-wrap {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            border: 2.5px solid var(--gold-primary);
            background: #ffffff;
            box-shadow: 0 0 22px rgba(255, 42, 81, 0.55), 0 0 14px rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Brand Typography */
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-pill {
            background: linear-gradient(135deg, #ff2a51 0%, #d91438 100%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 2.5px;
            padding: 3px 14px;
            border-radius: 20px;
            margin: 6px 0 14px;
            text-transform: uppercase;
            box-shadow: 0 0 14px rgba(217, 20, 56, 0.5);
        }

        /* Main Call to Action */
        .scan-action-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .scan-action-subtitle {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold-light);
            margin-top: 3px;
            margin-bottom: 16px;
        }

        /* BIG HIGH-CONTRAST QR CARD */
        .qr-card {
            background: #ffffff;
            border: 4px solid var(--gold-primary);
            border-radius: 22px;
            padding: 14px;
            box-shadow: 0 12px 34px rgba(0,0,0,0.85);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qr-img {
            width: 215px;
            height: 215px;
            display: block;
        }

        /* Payment apps supported pill */
        .payment-options-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            background: rgba(30, 8, 14, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .payment-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 7px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 10.5px;
        }

        /* Essential Details: Address & Contact */
        .details-box {
            width: 100%;
            border-top: 1.5px solid rgba(212, 175, 55, 0.4);
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #ffffff;
        }

        .detail-row.address {
            color: var(--gold-light);
            font-weight: 700;
            font-size: 13.5px;
        }

        .detail-row.contact {
            background: linear-gradient(135deg, rgba(217, 20, 56, 0.25) 0%, rgba(45, 12, 18, 0.9) 100%);
            border: 1px solid var(--lotus-neon);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 14.5px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
        }

        .contact-number-bold {
            color: #ffe680;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .controls-toolbar {
                display: none;
            }
            .standee-frame {
                box-shadow: none;
                max-width: 100%;
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: 4px solid #000;
                background-color: #0a0204;
            }
        }
    </style>
</head>
<body>

    <!-- Printable Controls -->
    <div class="controls-toolbar">
        <a href="index.html" class="btn-back">← Back to Menu</a>
        <button class="btn-print" onclick="window.print()">
            <span>🖨️</span> Print Standee (Ctrl+P)
        </button>
    </div>

    <!-- Clean, Focused Standee Frame -->
    <div class="standee-frame">
        
        <!-- Logo -->
        <div class="logo-wrap">
            <img src="logo.png" alt="Lotus Hut Logo" class="logo-img">
        </div>

        <!-- Brand Name -->
        <h1 class="brand-title">LOTUS HUT</h1>
        <div class="brand-pill">THE DRIVE IN CAFE</div>

        <!-- Scan CTA -->
        <div class="scan-action-title">📱 SCAN TO VIEW MENU & ORDER</div>
        <div class="scan-action-subtitle">अपनी गाड़ी से मेन्यू देखें और ऑर्डर करें</div>

        <!-- Big Clean QR Code -->
        <div class="qr-card">
            <img src="qr_digital_menu.png" alt="Scan to Order from Car" class="qr-img">
        </div>

        <!-- Payment Apps Supported (GPay, PhonePe, Paytm, WhatsApp, Cash) -->
        <div class="payment-options-row">
            <span>💳 Pay via:</span>
            <span class="payment-pill">🟣 PhonePe</span>
            <span class="payment-pill">🔵 Google Pay</span>
            <span class="payment-pill">🔷 Paytm</span>
            <span class="payment-pill">🟢 WhatsApp Pay</span>
            <span class="payment-pill">💵 Cash</span>
        </div>

        <!-- Address & Contact Number -->
        <div class="details-box">
            <div class="detail-row address">
                <span>📍</span>
                <span>Lotus Hut, The Drive In Cafe, Indore</span>
            </div>
            <div class="detail-row contact">
                <span>📞 Call & WhatsApp:</span>
                <span class="contact-number-bold">+91 91117 89220</span>
            </div>
        </div>

    </div>

</body>
</html>
